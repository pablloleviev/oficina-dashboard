<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoFlow — Ordens de Serviço</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --sidebar: #0f1823;
      --card: #131d2a;
      --card2: #162030;
      --border: rgba(255,255,255,0.07);
      --text: #e8edf3;
      --muted: #5a6a7e;
      --accent: #3b82f6;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --cyan: #06b6d4;
      --purple: #a78bfa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      font-size: 14px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 4px; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 200px; min-width: 200px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 24px 16px;
      position: fixed; top: 0; left: 0; bottom: 0;
      z-index: 10;
    }
    .sidebar-logo h1 {
      font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800;
      color: var(--text); letter-spacing: -0.3px;
    }
    .sidebar-logo p { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }
    .sidebar-section { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin: 24px 0 10px; padding-left: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; font-size: 13px;
      color: var(--muted); cursor: pointer; transition: all 0.15s;
      text-decoration: none; margin-bottom: 2px;
      border-left: 2px solid transparent;
    }
    .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-item.active { color: var(--text); background: rgba(59,130,246,0.08); border-left: 2px solid var(--accent); }
    .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .sidebar-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar-sm {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .sidebar-user-info p { font-size: 12px; font-weight: 500; color: var(--text); }
    .sidebar-user-info span { font-size: 10px; color: var(--muted); }
    .btn-sair { font-size: 12px; color: var(--red); background: none; border: none; cursor: pointer; padding: 0; font-family: 'DM Sans', sans-serif; }
    .btn-sair:hover { opacity: 0.7; }

    /* ── MAIN ── */
    .main { margin-left: 200px; flex: 1; padding: 28px 32px; overflow-y: auto; }

    /* ── TOPBAR ── */
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .topbar h2 { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; color: #fff; }
    .topbar p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .btn-primary {
      background: var(--accent); color: #fff; border: none; border-radius: 9px;
      padding: 9px 16px; font-size: 13px; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    /* ── ADD FORM ── */
    .add-form {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 22px;
    }
    .form-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr 1.2fr 1.5fr 1fr 1fr auto;
      gap: 8px;
    }
    .form-input {
      background: var(--card2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 12px;
      color: var(--text); font-family: 'DM Sans', sans-serif;
      outline: none; transition: border-color 0.15s;
    }
    .form-input::placeholder { color: var(--muted); }
    .form-input:focus { border-color: rgba(59,130,246,0.4); }
    .btn-add {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 12px; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      white-space: nowrap; transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.85; }

    /* ── KANBAN ── */
    .kanban {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .column {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .col-header {
      background: var(--card2);
      padding: 12px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .col-title-wrap { display: flex; align-items: center; gap: 8px; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .col-title { font-size: 12px; font-weight: 500; }
    .col-count {
      background: rgba(255,255,255,0.08); border-radius: 20px;
      padding: 2px 8px; font-size: 11px; color: var(--muted);
    }

    .col-body { padding: 10px; flex: 1; min-height: 160px; }

    /* ── OS CARD ── */
    .os-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 14px 0 14px;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .os-card::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
    }
    .os-card.pendente::before { background: #6b7280; }
    .os-card.andamento::before { background: var(--yellow); }
    .os-card.finalizado::before { background: var(--green); }
    .os-card.entregue::before { background: var(--accent); }

    .os-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .os-id { font-size: 9px; color: var(--muted); font-weight: 500; letter-spacing: 0.5px; }
    .badge-prio {
      font-size: 10px; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; letter-spacing: 0.3px;
    }
    .prio-alta { background: rgba(239,68,68,0.12); color: var(--red); }
    .prio-media { background: rgba(245,158,11,0.12); color: var(--yellow); }
    .prio-baixa { background: rgba(34,197,94,0.12); color: var(--green); }
    .prio-normal { background: rgba(90,106,126,0.12); color: var(--muted); }

    .os-client { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .os-vehicle { font-size: 11px; color: var(--muted); margin-bottom: 7px; }
    .os-service-tag {
      display: inline-block;
      background: rgba(59,130,246,0.1); color: var(--accent);
      border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 500;
      margin-bottom: 10px;
    }

    /* PROGRESS */
    .progress-wrap { margin-bottom: 10px; }
    .progress-header { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    .progress-bar { height: 4px; background: #1e2d3d; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .progress-fill.yellow { background: var(--yellow); }
    .progress-fill.green { background: var(--green); }

    .os-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px;
    }
    .os-value { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--green); }
    .os-date { font-size: 10px; color: var(--muted); }

    .os-actions {
      border-top: 1px solid var(--border);
      padding: 10px 0;
      display: flex; gap: 6px;
    }
    .btn-action {
      flex: 1; border: none; border-radius: 7px;
      padding: 7px 10px; font-size: 11px; font-weight: 600;
      font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-action:hover { opacity: 0.8; }
    .btn-blue { background: rgba(59,130,246,0.15); color: var(--accent); }
    .btn-red { background: rgba(239,68,68,0.1); color: var(--red); }
    .btn-green { background: rgba(34,197,94,0.1); color: var(--green); }
    .btn-gray { background: rgba(255,255,255,0.05); color: var(--muted); }
    .badge-faturado {
      flex: 1; text-align: center;
      background: rgba(34,197,94,0.1); color: var(--green);
      border-radius: 7px; padding: 7px 10px;
      font-size: 11px; font-weight: 600;
    }
    .btn-desfaturar { background: rgba(239,68,68,0.1); color: var(--red); flex: 1; border: none; border-radius: 7px; padding: 7px 10px; font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>AutoFlow</h1>
      <p>Gestão de Serviços</p>
    </div>
    <div class="sidebar-section">Menu</div>
    <nav>
      <a href="dashboard.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="clientes.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clientes
      </a>
      <a href="ordens.html" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Ordens
      </a>
      <a href="financeiro.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Financeiro
      </a>
      <a href="relatorios.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Relatórios
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar-sm">AD</div>
        <div class="sidebar-user-info">
          <p>Admin</p>
          <span>Administrador</span>
        </div>
      </div>
      <button class="btn-sair">Sair</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <div>
        <h2>Ordens de Serviço</h2>
        <p>Gestão operacional do fluxo de trabalho</p>
      </div>
      <button class="btn-primary" onclick="openForm()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nova Ordem
      </button>
    </div>

    <!-- ADD FORM -->
    <div class="add-form" id="add-form">
      <div class="form-label">Adicionar Nova Ordem</div>
      <div class="form-grid">
        <input class="form-input" id="f-cliente" placeholder="Cliente" />
        <input class="form-input" id="f-telefone" placeholder="Telefone" />
        <input class="form-input" id="f-veiculo" placeholder="Veículo" />
        <input class="form-input" id="f-placa" placeholder="Placa" />
        <input class="form-input" id="f-servico" placeholder="Serviço" />
        <input class="form-input" id="f-valor" type="number" placeholder="Valor" />
        <select class="form-input" id="f-status">
          <option value="pendente">Pendente</option>
          <option value="andamento">Em Andamento</option>
          <option value="finalizado">Finalizado</option>
          <option value="entregue">Entregue</option>
        </select>
        <button class="btn-add" onclick="addOS()">Adicionar</button>
      </div>
    </div>

    <!-- KANBAN -->
    <div class="kanban" id="kanban"></div>

  </main>

  <script>
    let ordens = [
      { id:'OS-7001', cliente:'Maria Alves', veiculo:'HB20', placa:'GHI9012', servico:'Revisão Geral', valor:280, status:'pendente', prioridade:'Alta', progresso:0, data:'Hoje, 09:32', faturado:false },
      { id:'OS-7002', cliente:'Roberto Ferreira', veiculo:'Gol', placa:'JKL1234', servico:'Alinhamento + Balanceamento', valor:120, status:'andamento', prioridade:'Média', progresso:60, data:'Ordem, 14:00', faturado:false },
      { id:'OS-7003', cliente:'Ana Costa', veiculo:'Polo', placa:'PQR1367', servico:'Troca de Pneus', valor:350, status:'andamento', prioridade:'Baixo', progresso:30, data:'Hoje, 11:15', faturado:false },
      { id:'OS-7004', cliente:'João Oliveira', veiculo:'Gol', placa:'ABC1234', servico:'Troca de Óleo', valor:150, status:'finalizado', prioridade:'Normal', progresso:100, data:'10/04, 16:00', faturado:false },
      { id:'OS-7005', cliente:'Carlos Silva', veiculo:'Civic', placa:'DFG5678', servico:'Manutenção Preventiva', valor:50, status:'entregue', prioridade:'Normal', progresso:100, data:'09/04, 10:00', faturado:true },
    ]

    let nextId = 7006

    function fmt(v) {
      return 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.')
    }

    function prioBadge(p) {
      const map = { Alta:'prio-alta', Média:'prio-media', Baixo:'prio-baixa', Normal:'prio-normal' }
      return `<span class="badge-prio ${map[p] || 'prio-normal'}">${p}</span>`
    }

    function renderCard(o) {
      const prog = o.status === 'andamento' ? `
        <div class="progress-wrap">
          <div class="progress-header"><span>Progresso</span><span>${o.progresso}%</span></div>
          <div class="progress-bar"><div class="progress-fill yellow" style="width:${o.progresso}%"></div></div>
        </div>
      ` : ''

      let actions = ''
      if (o.status === 'pendente') {
        actions = `<div class="os-actions">
          <button class="btn-action btn-blue" onclick="moveOS('${o.id}','andamento')">Iniciar</button>
          <button class="btn-action btn-red" onclick="deleteOS('${o.id}')">Cancelar</button>
        </div>`
      } else if (o.status === 'andamento') {
        actions = `<div class="os-actions">
          <button class="btn-action btn-green" onclick="moveOS('${o.id}','finalizado')">Finalizar</button>
          <button class="btn-action btn-gray" onclick="moveOS('${o.id}','pendente')">← Voltar</button>
        </div>`
      } else if (o.status === 'finalizado') {
        actions = `<div class="os-actions">
          <button class="btn-action btn-blue" onclick="moveOS('${o.id}','entregue')">🚚 Entregar</button>
          <button class="btn-action btn-gray" onclick="moveOS('${o.id}','andamento')">← Voltar</button>
        </div>`
      } else if (o.status === 'entregue') {
        if (o.faturado) {
          actions = `<div class="os-actions">
            <span class="badge-faturado">✓ Faturado</span>
            <button class="btn-desfaturar" onclick="toggleFaturar('${o.id}')">✕ Desfaturar</button>
          </div>`
        } else {
          actions = `<div class="os-actions">
            <button class="btn-action btn-green" onclick="toggleFaturar('${o.id}')">Faturar</button>
            <button class="btn-action btn-gray" onclick="moveOS('${o.id}','finalizado')">← Voltar</button>
          </div>`
        }
      }

      return `
        <div class="os-card ${o.status}">
          <div class="os-header">
            <span class="os-id">${o.id}</span>
            ${prioBadge(o.prioridade)}
          </div>
          <div class="os-client">${o.cliente}</div>
          <div class="os-vehicle">🚗 ${o.veiculo} · ${o.placa}</div>
          <span class="os-service-tag">${o.servico}</span>
          ${prog}
          <div class="os-footer">
            <span class="os-value">${fmt(o.valor)}</span>
            <span class="os-date">${o.data}</span>
          </div>
          ${actions}
        </div>
      `
    }

    function renderKanban() {
      const cols = [
        { key:'pendente', label:'PENDENTE', dot:'#6b7280', titleColor:'#9ca3af' },
        { key:'andamento', label:'EM ANDAMENTO', dot:'var(--yellow)', titleColor:'var(--yellow)' },
        { key:'finalizado', label:'FINALIZADO', dot:'var(--green)', titleColor:'var(--green)' },
        { key:'entregue', label:'ENTREGUE', dot:'var(--accent)', titleColor:'var(--accent)' },
      ]

      document.getElementById('kanban').innerHTML = cols.map(col => {
        const cards = ordens.filter(o => o.status === col.key)
        return `
          <div class="column">
            <div class="col-header">
              <div class="col-title-wrap">
                <div class="col-dot" style="background:${col.dot}"></div>
                <span class="col-title" style="color:${col.titleColor}">${col.label}</span>
              </div>
              <span class="col-count">${cards.length}</span>
            </div>
            <div class="col-body">
              ${cards.length ? cards.map(renderCard).join('') : '<div style="text-align:center;padding:24px 0;font-size:12px;color:var(--muted)">Vazio</div>'}
            </div>
          </div>
        `
      }).join('')
    }

    function moveOS(id, newStatus) {
      const o = ordens.find(x => x.id === id)
      if (o) {
        o.status = newStatus
        if (newStatus === 'andamento') o.progresso = 30
        if (newStatus === 'finalizado') o.progresso = 100
        renderKanban()
      }
    }

    function toggleFaturar(id) {
      const o = ordens.find(x => x.id === id)
      if (o) { o.faturado = !o.faturado; renderKanban() }
    }

    function deleteOS(id) {
      ordens = ordens.filter(x => x.id !== id)
      renderKanban()
    }

    function openForm() {
      document.getElementById('add-form').scrollIntoView({ behavior: 'smooth' })
      document.getElementById('f-cliente').focus()
    }

    function addOS() {
      const cliente = document.getElementById('f-cliente').value.trim()
      const veiculo = document.getElementById('f-veiculo').value.trim()
      const placa = document.getElementById('f-placa').value.trim()
      const servico = document.getElementById('f-servico').value.trim()
      const valor = parseFloat(document.getElementById('f-valor').value) || 0
      const status = document.getElementById('f-status').value

      if (!cliente || !servico) { alert('Preencha Cliente e Serviço'); return }

      const now = new Date()
      const hora = now.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })

      ordens.push({
        id: `OS-${nextId++}`,
        cliente, veiculo, placa, servico, valor, status,
        prioridade: 'Normal',
        progresso: status === 'andamento' ? 20 : (status === 'finalizado' || status === 'entregue' ? 100 : 0),
        data: `Hoje, ${hora}`,
        faturado: false
      })

      ;['f-cliente','f-telefone','f-veiculo','f-placa','f-servico','f-valor'].forEach(id => {
        document.getElementById(id).value = ''
      })
      document.getElementById('f-status').value = 'pendente'

      renderKanban()
    }

    renderKanban()
  </script>
</body>
</html>
